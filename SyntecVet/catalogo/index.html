<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0057a8" />
    <title>SyntecVet | Catálogo de Produtos</title>
    <meta
      name="description"
      content="Vitrine digital SyntecVet para pedidos, atendimento e painel do representante."
    />
    <link rel="manifest" href="/manifest.webmanifest?v=22" />
    <link rel="stylesheet" href="/styles.css?v=22" />
    <script src="/config.js?v=22"></script>
    <script defer src="/app.js?v=22"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-main">
        <a class="brand" href="#catalogo" aria-label="Syntec Saúde Animal">
          <img src="/assets/brand/syntec-logo.png" alt="Syntec Saúde Animal" />
        </a>

        <label class="header-search" for="headerSearch">
          <input id="headerSearch" type="search" placeholder="Pesquise um produto, espécie ou categoria" autocomplete="off" />
          <span data-icon="search" aria-hidden="true"></span>
        </label>

        <button class="help-button" id="headerHelp" type="button">
          <span>Precisa de ajuda?</span>
          <strong>Fale conosco</strong>
        </button>

        <nav class="nav-actions" aria-label="Navegação principal">
          <button class="cart-button" id="navCart" type="button" title="Carrinho" aria-label="Carrinho">
            <span data-icon="cart"></span>
            <strong id="cartBadge" class="badge" hidden>0</strong>
          </button>
          <button class="pill-button" id="navProfile" type="button" hidden>Admin</button>
        </nav>
      </div>

      <nav class="category-menu" aria-label="Menu do catálogo">
        <button class="menu-trigger" id="categoryMenuToggle" type="button" aria-expanded="false" aria-controls="categoryDropdown">
          <span data-icon="grid"></span>
          Categorias
          <span class="chevron" data-icon="chevron-down"></span>
        </button>
        <button class="catalog-link" id="navCatalog" type="button">Catálogo digital</button>
        <div class="category-current" aria-live="polite">
          <span>Categoria selecionada</span>
          <strong id="categoryCurrent">Todos os produtos</strong>
        </div>
      </nav>
      <div class="category-dropdown" id="categoryDropdown" hidden>
        <div class="category-dropdown-inner" aria-label="Todos os tipos de produtos">
          <button type="button" data-header-category="Todos">Todos os produtos</button>
          <button type="button" data-header-category="Anestésicos">Anestésicos</button>
          <button type="button" data-header-category="Anti-inflamatórios">Anti-inflamatórios</button>
          <button type="button" data-header-category="Antibióticos">Antibióticos</button>
          <button type="button" data-header-category="Antiparasitários">Antiparasitários</button>
          <button type="button" data-header-category="Biológicos">Biológicos</button>
          <button type="button" data-header-category="Broncodilatadores">Broncodilatadores</button>
          <button type="button" data-header-category="Ectoparasiticidas">Ectoparasiticidas</button>
          <button type="button" data-header-category="Endectocidas">Endectocidas</button>
          <button type="button" data-header-category="Especialidades">Especialidades</button>
          <button type="button" data-header-category="Higiene e Saúde">Higiene e Saúde</button>
          <button type="button" data-header-category="Hormônios">Hormônios</button>
          <button type="button" data-header-category="Suplementos">Suplementos</button>
          <button type="button" data-header-category="Vitamínicos e Minerais">Vitamínicos e Minerais</button>
        </div>
      </div>
      <div class="header-accent" aria-hidden="true"></div>
    </header>

    <main id="app" class="app-shell" tabindex="-1"></main>

    <footer class="site-footer">
      <p>
        &copy; 2026 <strong>SyntecVet</strong>. Desenvolvido por <strong>Catarina Magalh&atilde;es</strong>
        <span aria-hidden="true">&bull;</span> Vers&atilde;o 22
        <span aria-hidden="true">&bull;</span> Todos os direitos reservados.
      </p>
    </footer>

    <section class="chat-shell" id="chatShell" aria-label="Assistente virtual">
      <button class="chat-fab" id="chatToggle" type="button" aria-label="Abrir atendimento pelo WhatsApp" aria-controls="chatPanel" aria-expanded="false" title="Fale conosco pelo WhatsApp">
        <span data-icon="whatsapp"></span>
      </button>
      <div class="chat-panel" id="chatPanel" hidden>
        <div class="chat-head">
          <div>
            <strong>Atendimento SyntecVet</strong>
            <span>Assistente virtual</span>
          </div>
          <button class="icon-button ghost" id="chatClose" type="button" aria-label="Fechar chat">
            <span data-icon="close"></span>
          </button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" type="text" maxlength="500" autocomplete="off" placeholder="Pergunte sobre um produto" />
          <button class="icon-button accent" type="submit" aria-label="Enviar">
            <span data-icon="send"></span>
          </button>
        </form>
      </div>
    </section>

    <template id="iconTemplate">
      <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
    </template>
  </body>
</html>
